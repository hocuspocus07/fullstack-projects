# Netlify configuration file

[build]
  base = "car-api/frontend"
  publish = "build"
  command = "npm run build"

# Redirect all requests to index.html for a React single-page app (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables (optional)
[context.production.environment]
  REACT_APP_API_BASE_URL = "https://car-api-o2p5.onrender.com"

[context.development]
  # Configuration for development context
  publish = "car-api/frontend/src"
  command = "npm run dev"
